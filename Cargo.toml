[workspace]
members = [
    "crates/pandocmd-analysis",
    "crates/pandocmd-extensions",
    "crates/pandocmd-cli",
    "crates/pandocmd-lsp",
    "crates/pandocmd-pandoc",
    "crates/pandocmd-syntax",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/congyu/pandocmd-languageserver"
rust-version = "1.82"

[workspace.dependencies]
anyhow = "1.0"
crossbeam-channel = "0.5"
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
lsp-server = "0.7"
lsp-types = "0.94"
pandocmd-analysis = { path = "crates/pandocmd-analysis" }
pandocmd-extensions = { path = "crates/pandocmd-extensions" }
pandocmd-pandoc = { path = "crates/pandocmd-pandoc" }
pandocmd-syntax = { path = "crates/pandocmd-syntax" }
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tree-sitter = "0.23"
tree-sitter-pandoc-markdown = { path = "vendor/tree-sitter-pandoc-markdown", features = ["parser"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
